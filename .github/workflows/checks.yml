name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow

      - name: Rebuild assets and verify every assertion
        run: python build.py

      - name: Confirm the committed assets reproduce pixel-for-pixel
        run: python verify_reproducible.py
