<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Meadow — pixel zombie shooter</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #07080b; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color: #8a9098;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0b0d12;
    box-shadow: 0 0 0 1px #1c2128, 0 12px 48px #000;
    cursor: none;
  }
  #hint { font-size: 11px; letter-spacing: .04em; opacity: .55; }
  #hint b { color: #c8ccd2; font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="320" height="180"></canvas>
  <div id="hint">
    <b>A</b>/<b>D</b> or <b>←</b>/<b>→</b> move &nbsp;·&nbsp;
    <b>click</b> or <b>space</b> fire &nbsp;·&nbsp;
    <b>R</b> restart &nbsp;·&nbsp; <b>M</b> mute
  </div>
</div>

<!-- Plain scripts, not modules: ES modules are blocked over file:// -->
<script src="assets.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------- constants
const W = 320, H = 180;
const GROUND_Y = 148;
const GRAVITY = 620;

const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d", { alpha: false });
ctx.imageSmoothingEnabled = false;

function resize() {
  const pad = 96;
  const s = Math.max(1, Math.floor(Math.min(
    (innerWidth - 32) / W, (innerHeight - pad) / H)));
  cvs.style.width = (W * s) + "px";
  cvs.style.height = (H * s) + "px";
}
addEventListener("resize", resize); resize();

// ------------------------------------------------------------------- assets
const sheet = new Image();
let artReady = false;
sheet.onload = () => { artReady = true; };
if (window.ATLAS_PNG) sheet.src = window.ATLAS_PNG;
const ATLAS = window.ATLAS || {};
const ANCHOR = window.ANCHOR || {};

/** Draw one atlas cell. flip mirrors it horizontally about rx. */
function spr(key, rx, ry, flip) {
  const r = ATLAS[key];
  if (!r || !artReady) return false;
  const [sx, sy, sw, sh] = r;
  const x = Math.round(rx), y = Math.round(ry);
  if (flip) {
    ctx.save();
    ctx.translate(x + sw, y);
    ctx.scale(-1, 1);
    ctx.drawImage(sheet, sx, sy, sw, sh, 0, 0, sw, sh);
    ctx.restore();
  } else {
    ctx.drawImage(sheet, sx, sy, sw, sh, x, y, sw, sh);
  }
  return true;
}
function has(key) { return !!ATLAS[key]; }
function cellSize(key) { const r = ATLAS[key]; return r ? [r[2], r[3]] : [0, 0]; }

/** Y position that puts a sprite's own lowest opaque row on the given row. */
function standY(key, groundRow) {
  const a = ANCHOR[key];
  const h = cellSize(key)[1];
  return groundRow - (a ? a[0] : h - 1);
}

// -------------------------------------------------------------------- audio
// Everything is synthesised: no asset files, and it still gives the shooting
// real feedback, which is most of what makes a shooter feel like anything.
const Audio_ = (() => {
  let ac = null, muted = false, master = null;
  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.35;
    master.connect(ac.destination);
  }
  function env(node, t0, a, d, peak) {
    node.gain.setValueAtTime(0.0001, t0);
    node.gain.exponentialRampToValueAtTime(peak, t0 + a);
    node.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
  function noise(dur) {
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    return src;
  }
  return {
    init,
    get muted() { return muted; },
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.35; },
    shot() {
      if (!ac || muted) return;
      const t = ac.currentTime;
      const g = ac.createGain(); env(g, t, 0.002, 0.09, 0.9); g.connect(master);
      const s = noise(0.12); const f = ac.createBiquadFilter();
      f.type = "lowpass"; f.frequency.setValueAtTime(2600, t);
      f.frequency.exponentialRampToValueAtTime(400, t + 0.1);
      s.connect(f); f.connect(g); s.start(t); s.stop(t + 0.12);
      const o = ac.createOscillator(); o.type = "square";
      o.frequency.setValueAtTime(180, t);
      o.frequency.exponentialRampToValueAtTime(50, t + 0.07);
      const g2 = ac.createGain(); env(g2, t, 0.001, 0.07, 0.35);
      o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.09);
    },
    hit() {
      if (!ac || muted) return;
      const t = ac.currentTime;
      const g = ac.createGain(); env(g, t, 0.001, 0.06, 0.5); g.connect(master);
      const s = noise(0.08); const f = ac.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 1.2;
      s.connect(f); f.connect(g); s.start(t); s.stop(t + 0.08);
    },
    squelch() {
      if (!ac || muted) return;
      const t = ac.currentTime;
      const g = ac.createGain(); env(g, t, 0.004, 0.20, 0.55); g.connect(master);
      const s = noise(0.25); const f = ac.createBiquadFilter();
      f.type = "lowpass"; f.frequency.setValueAtTime(700, t);
      f.frequency.exponentialRampToValueAtTime(140, t + 0.2);
      s.connect(f); f.connect(g); s.start(t); s.stop(t + 0.25);
    },
    groan() {
      if (!ac || muted) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(70 + Math.random() * 40, t);
      o.frequency.linearRampToValueAtTime(48, t + 0.5);
      const g = ac.createGain(); env(g, t, 0.06, 0.44, 0.16);
      const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.55);
    },
    hurt() {
      if (!ac || muted) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = "triangle";
      o.frequency.setValueAtTime(300, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.22);
      const g = ac.createGain(); env(g, t, 0.004, 0.22, 0.4);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
    },
    reload() {
      if (!ac || muted) return;
      const t = ac.currentTime;
      [0, 0.09, 0.16].forEach((dt, i) => {
        const g = ac.createGain(); env(g, t + dt, 0.001, 0.05, 0.3 - i * 0.06);
        const s = noise(0.06); const f = ac.createBiquadFilter();
        f.type = "highpass"; f.frequency.value = 1800 - i * 300;
        s.connect(f); f.connect(g); g.connect(master); s.start(t + dt); s.stop(t + dt + 0.07);
      });
    },
  };
})();

// --------------------------------------------------------------------- input
const keys = Object.create(null);
let mouseDown = false, mx = W / 2, my = H / 2;
addEventListener("keydown", e => {
  Audio_.init();
  keys[e.code] = true;
  if (e.code === "KeyR") reset();
  if (e.code === "KeyM") Audio_.toggle();
  if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.code] = false; });
cvs.addEventListener("mousemove", e => {
  const r = cvs.getBoundingClientRect();
  mx = (e.clientX - r.left) / r.width * W;
  my = (e.clientY - r.top) / r.height * H;
});
cvs.addEventListener("mousedown", e => { Audio_.init(); mouseDown = true; e.preventDefault(); });
addEventListener("mouseup", () => { mouseDown = false; });
cvs.addEventListener("contextmenu", e => e.preventDefault());

// --------------------------------------------------------------------- state
let player, zombies, bullets, parts, decals, casings, floats;
let camX, shake, shakeT, hitstop, tGame, spawnT, score, wave, kills, gameOver, hurtFlash;
let footT;

function reset() {
  player = {
    x: 90, y: GROUND_Y, vx: 0, face: 1,
    clip: "idle", ft: 0, fireT: 0, recoil: 0,
    hp: 100, maxHp: 100, iframe: 0, dead: false,
  };
  zombies = []; bullets = []; parts = []; decals = []; casings = []; floats = [];
  camX = 0; shake = 0; shakeT = 0; hitstop = 0; tGame = 0;
  spawnT = 0.6; score = 0; wave = 1; kills = 0; gameOver = false; hurtFlash = 0;
  footT = 0;
}
reset();

// ------------------------------------------------------------------ feedback
function addShake(amount, dur) { shake = Math.max(shake, amount); shakeT = Math.max(shakeT, dur); }
function addPart(x, y, vx, vy, life, col, size, grav) {
  parts.push({ x, y, vx, vy, life, max: life, col, size, grav: grav === undefined ? GRAVITY : grav });
}
function addDecal(x, y, key) { decals.push({ x, y, key, a: 1 }); if (decals.length > 90) decals.shift(); }

function bloodBurst(x, y, dirx, amount) {
  for (let i = 0; i < amount; i++) {
    const a = Math.atan2((Math.random() - 0.65) * 1.4, dirx * (0.4 + Math.random()));
    const sp = 40 + Math.random() * 130;
    addPart(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 20,
      0.35 + Math.random() * 0.5,
      Math.random() < 0.3 ? "#c03030" : "#8c1f1f",
      1 + (Math.random() < 0.35 ? 1 : 0));
  }
}

function gibBurst(x, y, dirx) {
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
    const sp = 70 + Math.random() * 150;
    addPart(x, y - 8, Math.cos(a) * sp + dirx * 30, Math.sin(a) * sp,
      0.7 + Math.random() * 0.5, "#8c1f1f", 2);
  }
  bloodBurst(x, y - 6, dirx, 16);
  addShake(3.2, 0.22);
  hitstop = Math.max(hitstop, 0.055);
}

// --------------------------------------------------------------------- world
// Parallax offsets. Each layer is 320 wide and tiles, so a modulo keeps it
// seamless however far the camera travels.
function layerOffset(f, speed) { return -((camX * speed) % W); }

function spawnZombie() {
  const x = camX + W + 24 + Math.random() * 60;
  const tough = Math.random() < Math.min(0.35, 0.06 * wave);
  zombies.push({
    x, y: GROUND_Y, vx: 0, face: -1,
    hp: tough ? 3 : 1, maxHp: tough ? 3 : 1,
    speed: (14 + Math.random() * 16 + wave * 1.6) * (tough ? 0.7 : 1),
    clip: "walk", ft: Math.random() * 4, state: "walk", t: 0,
    flash: 0, dead: false, groanT: Math.random() * 4,
  });
}

function hurtPlayer(n) {
  if (player.iframe > 0 || player.dead) return;
  player.hp -= n;
  player.iframe = 0.5;
  hurtFlash = 1;
  addShake(4, 0.3);
  Audio_.hurt();
  if (player.hp <= 0) {
    player.hp = 0; player.dead = true; gameOver = true;
    bloodBurst(player.x, GROUND_Y - 16, -player.face, 22);
  }
}

// ---------------------------------------------------------------- generation
function fire() {
  if (player.dead) return;
  const dirx = player.face;
  const gx = player.x + dirx * 13;
  const gy = GROUND_Y - 22;
  bullets.push({ x: gx, y: gy, vx: dirx * 620, life: 0.7, dmg: 1 });
  // muzzle flash, light, casing, recoil, shake, smoke
  parts.push({ x: gx, y: gy, vx: 0, vy: 0, life: 0.055, max: 0.055,
    col: "flash", size: 0, grav: 0 });
  casings.push({ x: player.x - dirx * 2, y: GROUND_Y - 24,
    vx: -dirx * (24 + Math.random() * 30), vy: -70 - Math.random() * 40,
    rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, life: 2.2 });
  for (let i = 0; i < 3; i++) {
    addPart(gx, gy, dirx * (30 + Math.random() * 60), (Math.random() - 0.7) * 40,
      0.2 + Math.random() * 0.2, "#37546e", 1, 0);
  }
  player.recoil = 1;
  player.vx -= dirx * 22;
  addShake(1.5, 0.08);
  Audio_.shot();
}

function update(dt) {
  if (hitstop > 0) { hitstop -= dt; dt *= 0.15; }
  tGame += dt;

  if (shakeT > 0) { shakeT -= dt; shake = shake * (1 - dt * 9); if (shakeT <= 0) shake = 0; }
  if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 2.2);

  // ---- player
  if (!player.dead) {
    const left = keys.KeyA || keys.ArrowLeft;
    const right = keys.KeyD || keys.ArrowRight;
    const acc = 900, maxSpd = 92, fr = 8;
    if (left && !right) { player.vx -= acc * dt; player.face = -1; }
    else if (right && !left) { player.vx += acc * dt; player.face = 1; }
    else player.vx -= player.vx * Math.min(1, fr * dt);
    player.vx = Math.max(-maxSpd, Math.min(maxSpd, player.vx));
    player.x += player.vx * dt;
    player.x = Math.max(14, Math.min(camX + W - 14, player.x));

    const moving = Math.abs(player.vx) > 12;
    if (moving) {
      footT -= dt;
      if (footT <= 0) {
        footT = 0.22;
        for (let i = 0; i < 2; i++)
          addPart(player.x - player.face * 5, GROUND_Y - 1,
            -player.face * (8 + Math.random() * 20), -6 - Math.random() * 12,
            0.3 + Math.random() * 0.2, "#5b6068", 1, 40);
      }
    } else footT = 0;

    // clip selection: shoot overrides, then walk, then idle
    const wantShoot = (mouseDown || keys.Space) && player.fireT <= 0;
    if (wantShoot) {
      fire();
      player.fireT = 0.115;
      player.shootT = 0.22;
    }
    player.fireT = Math.max(0, player.fireT - dt);
    player.shootT = Math.max(0, (player.shootT || 0) - dt);
    player.clip = player.shootT > 0 ? "shoot" : (moving ? "walk" : "idle");
    const rate = player.clip === "walk" ? 9 : (player.clip === "idle" ? 3 : 12);
    player.ft += dt * rate;
    player.recoil = Math.max(0, player.recoil - dt * 7);
  }
  if (player.iframe > 0) player.iframe -= dt;

  // ---- camera follows, world scrolls with it
  const target = player.x - W * 0.38;
  camX += (target - camX) * Math.min(1, 4 * dt);

  // ---- spawning
  if (!gameOver) {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnZombie();
      wave = 1 + Math.floor(kills / 8);
      spawnT = Math.max(0.42, 1.5 - wave * 0.09) * (0.7 + Math.random() * 0.6);
    }
  }

  // ---- bullets
  for (const b of bullets) {
    b.px = b.x;
    b.x += b.vx * dt;
    b.life -= dt;
    for (const z of zombies) {
      if (z.dead) continue;
      if (b.x > z.x - 11 && b.x < z.x + 11 && b.y > GROUND_Y - 32 && b.y < GROUND_Y) {
        b.life = 0;
        z.hp -= b.dmg;
        z.flash = 0.09;
        z.x += Math.sign(b.vx) * 2.2;          // knockback
        bloodBurst(b.x, b.y, Math.sign(b.vx), 8);
        Audio_.hit();
        addShake(0.9, 0.06);
        if (z.hp <= 0) {
          z.dead = true; z.state = "death"; z.t = 0; z.ft = 0;
          kills++; score += 100;
          gibBurst(z.x, GROUND_Y - 14, Math.sign(b.vx));
          floats.push({ x: z.x, y: GROUND_Y - 34, t: 0.7, txt: "+100" });
          Audio_.squelch();
        }
        break;
      }
    }
    // ground / offscreen
    if (b.life <= 0) {
      if (b.x < camX - 20 || b.x > camX + W + 20) continue;
      addPart(b.x, b.y, (Math.random() - 0.5) * 40, -20 - Math.random() * 30,
        0.25, "#8c8f96", 1);
    }
  }
  bullets = bullets.filter(b => b.life > 0);

  // ---- zombies
  for (const z of zombies) {
    if (z.state === "death") {
      z.t += dt; z.ft += dt * 9;
      if (z.ft >= 5) {
        if (!z.pooled) { z.pooled = true; addDecal(z.x, GROUND_Y - 4, "fx.bloodpool"); }
        z.ft = 4.999;
      }
      continue;
    }
    z.flash = Math.max(0, z.flash - dt);
    z.groanT -= dt;
    if (z.groanT <= 0) { z.groanT = 3 + Math.random() * 6; if (Math.random() < 0.5) Audio_.groan(); }

    const dx = (player.x) - z.x;
    const near = Math.abs(dx) < 15;
    if (near && !player.dead) {
      z.state = "attack"; z.ft += dt * 7;
      z.hurtT = (z.hurtT || 0) - dt;
      if (z.hurtT <= 0) { hurtPlayer(9); z.hurtT = 0.95; }
    } else {
      z.state = "walk"; z.ft += dt * (3.2 + z.speed / 14);
      z.x += Math.sign(dx) * z.speed * dt;
      z.face = Math.sign(dx) || -1;
    }
  }
  // separate zombies so they do not stack into one blob
  for (let i = 0; i < zombies.length; i++) {
    for (let j = i + 1; j < zombies.length; j++) {
      const a = zombies[i], b = zombies[j];
      if (a.state === "death" && b.state === "death") continue;
      const d = b.x - a.x;
      if (Math.abs(d) < 13) {
        const push = (13 - Math.abs(d)) * 0.5 * Math.sign(d || 1);
        a.x -= push * 0.5; b.x += push * 0.5;
      }
    }
  }
  zombies = zombies.filter(z => !(z.state === "death" && z.t > 3) && z.x > camX - 120);

  // ---- particles / casings / floats
  for (const p of parts) {
    p.life -= dt;
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.grav > 0 && p.y > GROUND_Y - 1) { p.y = GROUND_Y - 1; p.vy *= -0.28; p.vx *= 0.6; }
  }
  parts = parts.filter(p => p.life > 0);
  for (const c of casings) {
    c.life -= dt; c.vy += GRAVITY * dt;
    c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    if (c.y > GROUND_Y - 1) { c.y = GROUND_Y - 1; c.vy *= -0.35; c.vx *= 0.5; c.vr *= 0.5; }
  }
  casings = casings.filter(c => c.life > 0);
  for (const f of floats) { f.t -= dt; f.y -= dt * 14; }
  floats = floats.filter(f => f.t > 0);

  // blood decals slowly soak in but never fully vanish
  for (const d of decals) d.a = Math.max(0.45, d.a - dt * 0.02);
}

// -------------------------------------------------------------------- render
function drawParallax() {
  const layers = [["bg.sky", 0.06], ["bg.far", 0.22], ["bg.mid", 0.5], ["bg.street", 1.0]];
  const ys = { "bg.sky": 0, "bg.far": GROUND_Y - 52, "bg.mid": GROUND_Y - 60, "bg.street": GROUND_Y - 8 };
  for (const [key, spd] of layers) {
    if (!has(key)) continue;
    const [w] = cellSize(key);
    if (!w) continue;
    let x = layerOffset(spd, spd) - w;
    const y = ys[key];
    while (x < W + w) { spr(key, x, y, false); x += w; }
  }
  if (!has("bg.sky")) { ctx.fillStyle = "#141a2a"; ctx.fillRect(0, 0, W, GROUND_Y); }
  if (!has("bg.street")) { ctx.fillStyle = "#23262c"; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y); }
}

function drawFallback(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x - w / 2), Math.round(y - h), w, h);
}

function render() {
  ctx.save();
  const sx = shake ? (Math.random() - 0.5) * shake * 2 : 0;
  const sy = shake ? (Math.random() - 0.5) * shake * 2 : 0;
  ctx.translate(Math.round(sx), Math.round(sy));

  drawParallax();

  // decals sit on the ground, under everything else
  for (const d of decals) {
    ctx.globalAlpha = d.a;
    const dy = standY(d.key, d.y);
    if (!spr(d.key, d.x - camX - 10, dy, false)) {
      ctx.fillStyle = "#4a1010";
      ctx.fillRect(Math.round(d.x - camX - 6), d.y - 3, 14, 3);
    }
  }
  ctx.globalAlpha = 1;

  // casings
  for (const c of casings) {
    ctx.save();
    ctx.translate(Math.round(c.x - camX), Math.round(c.y));
    ctx.rotate(c.rot);
    ctx.fillStyle = "#c8a24a";
    ctx.fillRect(-1, -1, 3, 2);
    ctx.restore();
  }

  // zombies (death clip first so live ones draw over the fallen)
  const order = zombies.slice().sort((a, b) => (a.state === "death" ? -1 : 0) - (b.state === "death" ? -1 : 0));
  for (const z of order) {
    const clip = z.state === "death" ? "death" : z.state;
    const i = Math.floor(z.ft) % 5;
    const key = `zombie.${clip}.${i}`;
    const px = z.x - camX - 11;
    const py = standY(has(key) ? key : "zombie.walk.0", GROUND_Y);
    let drew = spr(key, px, py, z.face > 0);
    if (!drew) drew = spr("zombie.walk.0", px, py, z.face > 0);
    if (!drew) drawFallback(z.x - camX, GROUND_Y, 14, 30, "#5c7038");
    if (z.flash > 0) {
      ctx.globalAlpha = Math.min(1, z.flash * 9);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(px, py, 22, 32);
      ctx.globalAlpha = 1;
    }
  }

  // player
  {
    const clip = player.dead ? "idle" : player.clip;
    const frames = clip === "walk" ? 4 : (clip === "shoot" ? 3 : 2);
    const i = Math.floor(player.ft) % frames;
    const px = player.x - camX - 12;
    const py = standY(has(`player.${clip}.${i}`) ? `player.${clip}.${i}` : "player.idle.0", GROUND_Y);
    const flashOn = player.iframe > 0 && Math.floor(tGame * 30) % 2 === 0;
    ctx.globalAlpha = player.dead ? 0.85 : 1;
    let drew = spr(`player.${clip}.${i}`, px, py, player.face < 0);
    if (!drew) drew = spr("player.idle.0", px, py, player.face < 0);
    if (!drew) drawFallback(player.x - camX, GROUND_Y, 16, 30, "#4a5a3c");
    ctx.globalAlpha = 1;
    if (flashOn) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#e04a38";
      ctx.fillRect(px, py, 24, 32);
      ctx.globalAlpha = 1;
    }
  }

  // bullets
  for (const b of bullets) {
    const px = b.x - camX;
    if (!spr("fx.bullet.0", px - 5, b.y - 2, b.vx < 0)) {
      ctx.fillStyle = "#ffd24a";
      ctx.fillRect(Math.round(px), Math.round(b.y), 5, 1);
    }
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#ffd24a";
    ctx.fillRect(Math.round(px - Math.sign(b.vx) * 12), Math.round(b.y), 8, 1);
    ctx.globalAlpha = 1;
  }

  // particles
  for (const p of parts) {
    if (p.col === "flash") {
      const r = ["fx.muzzle.1", "fx.muzzle.2", "fx.muzzle.0", "fx.muzzle.3"];
      const k = r[Math.min(3, Math.floor((1 - p.life / p.max) * 4))];
      if (!spr(k, p.x - camX - 8, p.y - 6, player.face < 0)) {
        ctx.fillStyle = "#ffd24a";
        ctx.fillRect(Math.round(p.x - camX), Math.round(p.y) - 1, 6, 3);
      }
      // muzzle light
      const g = ctx.createRadialGradient(p.x - camX, p.y, 0, p.x - camX, p.y, 46);
      g.addColorStop(0, "rgba(255,210,74,0.30)");
      g.addColorStop(1, "rgba(255,210,74,0)");
      ctx.fillStyle = g;
      ctx.fillRect(p.x - camX - 46, p.y - 46, 92, 92);
      continue;
    }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
    ctx.fillStyle = p.col;
    const s = p.size;
    ctx.fillRect(Math.round(p.x - camX), Math.round(p.y), s, s);
  }
  ctx.globalAlpha = 1;

  // score popups
  ctx.font = "6px monospace";
  ctx.textAlign = "center";
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.t * 2);
    ctx.fillStyle = "#e8e0b0";
    ctx.fillText(f.txt, Math.round(f.x - camX), Math.round(f.y));
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  ctx.restore();

  // ---- HUD (not shaken)
  // low health vignette
  if (player.hp <= 35) {
    const a = (1 - player.hp / 35) * 0.45 * (0.75 + 0.25 * Math.sin(tGame * 5));
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.85);
    g.addColorStop(0, "rgba(140,20,20,0)");
    g.addColorStop(1, "rgba(140,20,20," + a.toFixed(3) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (hurtFlash > 0) {
    ctx.fillStyle = "rgba(200,40,40," + (hurtFlash * 0.22).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  // health bar
  ctx.fillStyle = "rgba(10,12,16,0.75)";
  ctx.fillRect(6, 6, 84, 9);
  ctx.fillStyle = "#2a1a1a";
  ctx.fillRect(7, 7, 82, 7);
  const hw = Math.round(82 * Math.max(0, player.hp) / player.maxHp);
  ctx.fillStyle = player.hp > 35 ? "#c0392b" : "#e04a38";
  ctx.fillRect(7, 7, hw, 7);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(7, 7, hw, 2);
  ctx.strokeStyle = "#0b0d12"; ctx.lineWidth = 1;
  ctx.strokeRect(6.5, 6.5, 83, 8);

  // score / wave
  ctx.font = "bold 8px monospace";
  ctx.fillStyle = "#d8dce2";
  ctx.fillText(String(score).padStart(6, "0"), 7, 24);
  ctx.font = "6px monospace";
  ctx.fillStyle = "#8a9098";
  ctx.fillText("WAVE " + wave + "   KILLS " + kills, 7, 33);

  // crosshair
  ctx.strokeStyle = "rgba(230,230,240,0.75)";
  ctx.lineWidth = 1;
  const chx = Math.round(mx) + 0.5, chy = Math.round(my) + 0.5;
  ctx.beginPath();
  ctx.moveTo(chx - 5, chy); ctx.lineTo(chx - 2, chy);
  ctx.moveTo(chx + 2, chy); ctx.lineTo(chx + 5, chy);
  ctx.moveTo(chx, chy - 5); ctx.lineTo(chx, chy - 2);
  ctx.moveTo(chx, chy + 2); ctx.lineTo(chx, chy + 5);
  ctx.stroke();

  if (Audio_.muted) {
    ctx.fillStyle = "#5a6068"; ctx.font = "6px monospace";
    ctx.fillText("MUTED", W - 32, 12);
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(8,9,12,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.font = "bold 16px monospace";
    ctx.fillStyle = "#c0392b";
    ctx.fillText("YOU DIED", W / 2, H / 2 - 12);
    ctx.font = "8px monospace";
    ctx.fillStyle = "#d8dce2";
    ctx.fillText("SCORE " + score + "   KILLS " + kills + "   WAVE " + wave, W / 2, H / 2 + 6);
    ctx.fillStyle = "#8a9098";
    ctx.fillText("press R to try again", W / 2, H / 2 + 22);
    ctx.textAlign = "left";
  }
}

// ---------------------------------------------------------------- main loop
let last = performance.now(), acc = 0;
const STEP = 1 / 60;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;            // tab was backgrounded
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 6) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// expose for the smoke test / debugging
window.__game = {
  get state() { return { player, zombies, bullets, parts, decals, casings, score, wave, kills, gameOver, camX }; },
  reset, update, render,
  step(n) { for (let i = 0; i < n; i++) update(STEP); },
  setKey(k, v) { keys[k] = v; },
  fire,
  spawnZombie,
};
</script>
</body>
</html>
